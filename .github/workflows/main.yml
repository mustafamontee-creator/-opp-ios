name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract project ZIP
        run: |
          mkdir -p extracted www
          unzip -q Opp-ios-prepared.zip -d extracted
          INDEX_PATH="$(find extracted -type f -name index.html -print -quit)"
          if [ -z "$INDEX_PATH" ]; then
            echo "index.html not found inside Opp-ios-prepared.zip"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          PROJECT_DIR="$(dirname "$INDEX_PATH")"
          cp -R "$PROJECT_DIR"/. www/
          echo "Web project copied from $PROJECT_DIR"
          ls -la www

      - name: Create Capacitor project configuration
        run: |
          cat > package.json <<'EOF'
          {
            "name": "opp-ios-build",
            "version": "1.0.0",
            "private": true
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.opp.app",
            "appName": "Opp",
            "webDir": "www"
          }
          EOF
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync iOS
        run: npx cap sync ios

      - name: Build app
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Opp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Opp-IPA
          path: Opp.ipa
